<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <div class="logo">🔒</div>
    <div>
      <h1>BiliLock <span class="sub">B站上锁</span></h1>
      <div class="status" id="status">载入中…</div>
      <div class="ver" id="ver"></div>
    </div>
  </header>

  <section class="block">
    <h2>分区上锁</h2>
    <div class="zone-tools">
      <button id="zoneAll">全选</button>
      <button id="zoneInvert">反选</button>
      <button id="zoneNone">清空</button>
      <span class="hint">只看某分区 = 反选后仅取消勾选它</span>
    </div>
    <div class="zone-grid" id="zoneGrid"></div>
  </section>

  <section class="block">
    <h2>通用</h2>
    <label class="switch"><input type="checkbox" id="removeAds" /><span>去掉广告（首页 / 视频页所有广告位）</span></label>
  </section>

  <section class="block">
    <h2>视频页</h2>
    <label class="switch"><input type="checkbox" id="hideComments" /><span>去掉评论区</span></label>
    <label class="switch"><input type="checkbox" id="hideRecommend" /><span>去掉视频推荐（相关推荐 / 连播）</span></label>
    <label class="switch"><input type="checkbox" id="pureVideoMode" /><span>一键过滤视频（弹幕 + 评论区 + 推荐全消失）</span></label>
  </section>

  <section class="block">
    <h2>白名单模式</h2>
    <label class="switch"><input type="checkbox" id="favoritesOnly" /><span>只看收藏夹（其余全站上锁）</span></label>
    <div class="fav-row">
      <span id="favStatus" class="hint">收藏夹缓存：未知</span>
      <button id="favRefresh">刷新收藏夹</button>
    </div>
    <div class="fav-row">
      <span id="zoneLibStatus" class="hint">分区库：加载中…</span>
      <button id="zoneLibRefresh">更新分区库</button>
    </div>
  </section>

  <section class="block">
    <h2>诊断（当前标签页）</h2>
    <button id="diagBtn">检测本页为何未上锁</button>
    <pre id="diagOut" class="diag"></pre>
  </section>

  <footer>
    <span>上锁仅在本机生效</span>
    <a href="#" id="openOptions">完整设置</a>
  </footer>

  <script src="../lib/zones-data.js"></script>
  <script src="../lib/rules.js"></script>
  <script src="../lib/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
